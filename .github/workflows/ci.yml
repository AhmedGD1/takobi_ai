name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Setup .NET
      # -----------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # -----------------------------
      # Restore
      # -----------------------------
      - name: Restore
        run: dotnet restore TakobiAI.csproj

      # -----------------------------
      # Build
      # -----------------------------
      - name: Build
        run: dotnet build TakobiAI.csproj --configuration Release --no-restore

      # -----------------------------
      # Validate plugin structure
      # -----------------------------
      - name: Validate plugin structure
        run: |
          test -f addons/takobi_ai/plugin.cfg
          test -d addons/takobi_ai